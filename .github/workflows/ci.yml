name: Template service
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: templates
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: templates_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U templates -d templates_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://templates:test-password@localhost:5432/templates_test
      TEST_DATABASE_URL: postgresql+psycopg://templates:test-password@localhost:5432/templates_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: npm ci
      - run: uv run python -m tools.build_empty_release
      - run: npm run worker:dry-run
