services:
  templates:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://templates:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/templates
      LISTEN_HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports: ["127.0.0.1:8093:8093"]
    volumes: ["template-data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 240s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: templates
      POSTGRES_DB: templates
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["template-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templates -d templates"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  template-data:
  template-postgres:
